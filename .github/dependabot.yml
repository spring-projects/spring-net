version: 2
updates:
  # Central package versions (Directory.Packages.props) and the dotnet local tools manifest.
  # NOTE: Fallout.Common (a PackageReference in build-support/build) and fallout.globaltool
  # (.config/dotnet-tools.json) must stay in lockstep; Dependabot bumps them independently.
  # They are excluded here and bumped manually together (see "Agent hazards" in AGENTS.md).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "Fallout.*"
    ignore:
      - dependency-name: "Fallout.*"
      # Quartz is on two lines: Directory.Packages.props holds 3.x for Spring.Scheduling.Quartz3 (maintenance-only), and
      # Spring.Scheduling.Quartz4 carries its 4.x version as VersionOverride on its own PackageReference. Dependabot reads
      # VersionOverride, and a rule is per dependency name, not per file, so the major rule is what keeps the lines
      # apart: 3.x is never moved to 4.x, and 4.x minor and patch updates of the Quartz4 project are still proposed.
      # A Quartz 5 for Spring.Scheduling.Quartz4 has to be moved by hand.
      - dependency-name: "Quartz"
        update-types: ["version-update:semver-major"]
      # Floors that consumers of the netstandard2.0 and net472 builds inherit. Raising one makes every .NET Framework
      # application move to that version, and usually add a binding redirect, so they move only by a deliberate change.
      # Patch updates on the same line (security fixes) are still proposed.
      # System.Memory stays at 4.5.5: Parlot's generated parser needs nothing newer, and the examples raise it for
      # themselves in examples/Directory.Packages.props.
      - dependency-name: "System.Memory"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Kept on the 8.0 line (BreakingChanges.txt, item 5). Microsoft.Extensions.Logging is used by the examples only,
      # and stays on the line that matches the Logging.Abstractions floor (see Directory.Packages.props).
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Configuration.ConfigurationManager"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.CodeDom"
        update-types: ["version-update:semver-major"]

  # One grouped PR per week for the website instead of one PR per package.
  # Security updates are not affected by "groups" unless they match a group's applies-to,
  # so they keep arriving as separate, immediate PRs.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      website-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Gatsby 5 is pinned to React 18 and webpack-era tooling; majors need a Gatsby upgrade.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gatsby*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sharp"
      - dependency-name: "file-type"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
