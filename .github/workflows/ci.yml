name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '*.md'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - 'website/**'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0
      - uses: actions/checkout@v7
      - name: Run './build.cmd ci'
        run: ./build.cmd ci

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0
      - uses: actions/checkout@v7
      - name: Run './build.cmd ci'
        run: ./build.sh ci

  # The SQL Server and ActiveMQ backed integration tests. Each test assembly starts its own container with Testcontainers,
  # which needs only the Docker daemon that ubuntu-latest provides.
  integration-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0
      - uses: actions/checkout@v7
      - name: Run './build.sh Compile IntegrationTest'
        run: ./build.sh Compile IntegrationTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: artifacts/TestResults
          if-no-files-found: ignore

